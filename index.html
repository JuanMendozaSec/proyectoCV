<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Feliz Cumpleaños ANA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="card">
        <div id="image-container">
            <div id="placeholder-initials">ANA</div>
            <img id="profile-img" src="imagen.jpg" alt="Foto de ANA">
        </div>
        <h1>Feliz Cumpleaños</h1>
        <h2 id="name">ANA</h2>
        <div id="message">
            <p>Hoy es un día especial para celebrar tu vida, tu sonrisa y todo lo que eres.</p>
            <p>Que todos tus sueños se hagan realidad. ¡Disfruta tu día al máximo!</p>
        </div>
        <div id="footer">Con mucho cariño</div>
        <canvas id="confetti-canvas"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
